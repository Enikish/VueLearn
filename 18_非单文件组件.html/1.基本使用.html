<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/vue.js"></script>
    <title>Document</title>
    <body>
        <div id="root">
            <school></school>
            <hr>
            <student></student>
            <hello></hello>
        </div>
        <script type="text/javascript">

            // 创建一个组件
            const hello = Vue.extend({
                template:`
                    <div>
                        <h2>{{msg}}</h2>    
                    </div>
                `,

                data() {
                    return {
                        msg: 'hello',
                    }
                },
            })
            // 注册全局组件
            Vue.component('hello', hello)

            // 创建school组件
            const school = Vue.extend({
                template:`
                    <div>
                        <h2>学校名称:{{schoolName}}</h2>
                        <h2>学校地址:{{address}}</h2>    
                    </div>
                `,

                // 组件定义时，不能写el配置项，因为组件最终会被一个vm管理，由vm决定
                data() {
                    return {
                        schoolName: '尚硅谷',
                        address: '北京昌平',
                    }
                },  
            })

            // 创建student组件
            const student = Vue.extend({
                template:`
                <div>
                    <h2>学生姓名:{{studentName}}</h2>
                    <h2>学生年龄:{{age}}</h2>
                </div>
                `,

                // 组件定义时，不能写el配置项，因为组件最终会被一个vm管理，由vm决定
                data() {
                    return {
                        studentName: '张三',
                        age: 18,
                    }
                },  
            })

            new Vue({
                el:'#root',

                // 注册组件(局部)
                components:{
                    school: school,
                    student:student
                }
            })
        </script>
    </body>
</head>
</html>
