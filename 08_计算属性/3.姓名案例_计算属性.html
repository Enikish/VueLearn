        new Vue({
            el:'#root',
            data() {
                return {
                    firstName:'张',
                    lastName:'三',
                }
            },
            computed:{
                fullName:{
                    // 计算属性在得到后会进行缓存，直到被修改时重新计算
                    get(){
                        return this.firstName + this.lastName;
                    }
                }
            }
        })
    </script>
