<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/days.min.js"></script>
    <script src="../js/vue.js"></script>
    <title>Document</title>
    <body>
        <div id="root">
            <h2>显示格式化后的时间</h2>
            <!-- 计算属性实现 -->
            <h3>现在是:{{fmtTime}}</h3>

            <!-- methods实现 -->
            <h3>现在是:{{getFmtTime()}}</h3>

            <!-- 过滤器实现 -->
            <h3>现在是:{{time | timeFormatter}}</h3>
            
        </div>
        <script type="text/javascript">
            new Vue({
            el: '#root',
            data: {
                time:Date.now(),
            },
            computed:{
                fmtTime:{
                    get(){
                        return dayjs(this.time).format('YYYY-MM-DD HH:mm:ss')
                    }
                },
            },
            methods: {
                getFmtTime(){
                    return dayjs(this.time).format('YYYY-MM-DD HH:mm:ss')
                }
            },

            // vue3弃用filters
            filters:{
                timeFormatter(value){
                    return dayjs(this.time).format('YYYY-MM-DD HH:mm:ss')
                }
            }
        })
        </script>
    </body>
</head>
</html>
