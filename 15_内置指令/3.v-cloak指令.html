<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/vue.js"></script>
    <title>Document</title>
    <style>
        /* v-cloak指令配合css解决在客户端网速慢时加载过慢导致vue还没记载出来就显示html */
        [v-cloak]{
            display: none;
        }
    </style>
    <body>
        <div id="root">
            <h2 v-cloak>{{name}}</h2>
        </div>
        <script type="text/javascript">
            new Vue({
                el: '#root',
                data: {
                    name: 'Enish',
                },
            })
        </script>
    </body>
</head>
</html>
