<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../js/vue.js"></script>
</head>
<body>

    <!-- 插值语法用于标签体内 -->
    <div id="root">
        <h1>插值语法</h1>
        <h3>{{name}}</h3>
        <hr/>
        <!-- 指令语法用于标签属性 -->
        <a v-bind:href="url">Hello</a>

    </div>
    <script>
        new Vue({
            el: "#root",
            data: {
                name: 'Enish',
                url: 'https://www.baidu.com'
            }
        })
    </script>
</body>
</html>
