<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../js/vue.js"></script>
</head>
<body>
    
    <div id="root">
        <h2>今天的天气很：{{info}}</h2>
        <button @click="changeWeather">切换天气</button>
        <br>
        <span>{{numbers.a}}</span>
        <button @click="numbers.a++;">a++</button>
        <br>
        <span>{{numbers.b}}</span>
        <button @click="numbers.b++;">a++</button>
    </div>

    <script>
        new Vue({
            el:'#root',
            data() {
                return {
                    isHot:true,
                    numbers:{
                        a: 1,
                        b: 0,
                    }
                }
            },
            computed:{
                info(){
                    return this.isHot ? '炎热': '凉爽';
                }
            },
            methods: {
                changeWeather(){
                    this.isHot = !this.isHot;
                }
            },
            watch:{
                isHot:{
                    immediate:false,
                    // 当监视的属性发生改变时调用handler
                    handler(newValue, oldValue){
                        console.log('isHot 被修改了,',newValue, oldValue);
                    }
                },
                // 监视多级属性中的某个变化
                'numbers.a':{
                    handler()
                    {
                        console.log('a被修改了');
                    }
                },
                numbers:{
                    // 监视多级属性中的所有变化
                    deep: true,
                    handler(){
                        console.log('numbers改变了')
                    }
                }
            }
        })
    </script>
</body>
</html>
