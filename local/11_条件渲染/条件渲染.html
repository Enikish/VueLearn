<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/vue.js"></script>
    <title>Document</title>
    <body>
        <div id="root">
            <!-- v-show做条件渲染(调整display属性) -->
            <h2 v-show="false">欢迎来到{{name}}</h2>

            <!-- v-if做条件渲染 -->
            <h2 v-if="false">欢迎来到{{name}}</h2>

            <h2>当前值是{{n}}</h2>
            <button @click="n++;">点击+1</button>

            <div v-if="n===1">Python</div>
            <div v-else-if="n===2">C++</div>
            <div v-else-if="n===3">Java</div>

            <!-- template在页面中不影响文件结构 -->
            <template v-if="n===4">
                <div>DFS</div>
                <div>HFS</div>
            </template>

        </div>
        <script type="text/javascript">
            new Vue({
            el: '#root',
            data: {
                name: 'Enish',
                n: 0,
            },
            })
        </script>
    </body>
</head>
</html>
