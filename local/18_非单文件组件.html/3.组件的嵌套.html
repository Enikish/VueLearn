<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/vue.js"></script>
    <title>Document</title>
    <body>
        <div id="root">
        </div>
        <script type="text/javascript">

            // 创建student组件
            const student = Vue.extend({
                template:`
                <div>
                    <h2>学生姓名:{{studentName}}</h2>
                    <h2>学生年龄:{{age}}</h2>
                </div>
                `,

                // 组件定义时，不能写el配置项，因为组件最终会被一个vm管理，由vm决定
                data() {
                    return {
                        studentName: '张三',
                        age: 18,
                    }
                },  
            })
            
            const school = Vue.extend({
                // 使用name属性，在vue开发者工具中就显示的该名称
                name: 'atguigu',
                template:`
                    <div>
                        <h2>学校名称:{{schoolName}}</h2>
                        <h2>学校地址:{{address}}</h2>    
                        <student></student>
                    </div>
                `,

                // 组件定义时，不能写el配置项，因为组件最终会被一个vm管理，由vm决定
                data() {
                    return {
                        schoolName: '尚硅谷',
                        address: '北京昌平',
                    }
                },  
                components:{
                    student:student,
                }
            })

            const hello = Vue.extend({
                template:`<h2>{{msg}}</h2>`,
                data(){
                    return{
                        msg: 'Hello',
                    }
                }
            })

            const app = Vue.extend({
                template:`
                <div>
                    <school></school>
                    <hello></hello>
                </div>  
                `,
                components:{
                    school:school,
                    hello:hello,
                }
            })

            new Vue({
                template:`<app></app>`,
                el: '#root',
                data: {
                    msg:'欢迎',
                },
                components:{
                    app:app,
                }
            })
        </script>
    </body>
</head>
</html>
