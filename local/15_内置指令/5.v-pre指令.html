<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/vue.js"></script>
    <title>Document</title>
    <body>
        <div id="root">
            <!-- 
                v-pre可以跳过所在节点的编译
                可用于没有使用vue语法的节点，以加快编译
             -->
            <h2 v-pre>Vue很简单</h2>
            <h2>当前n的值是: {{n}}</h2>
            <button @click="n++">点击n+1</button>
        </div>
        <script type="text/javascript">
            new Vue({
            el: '#root',
            data: {
                n: 0,
            },
            })
        </script>
    </body>
</head>
</html>
