<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/vue.js"></script>
    <title>Document</title>
    <body>
        <div id="root">
            <h2>学生信息</h2>
            <button @click="student.age++">年龄+1</button>
            <br/>    
            <button @click="addSex">添加性别属性,默认值:男</button>
            <br/>    
            <button @click="addFriend">在列表首位添加一个朋友</button>
            <br/>    
            <button @click="updateFirstFriend">修改第一个朋友的名字为:张三</button>
            <br/>    
            <button @click="addHobby">添加一个爱好</button>
            <br/>    
            <button @click="updateHobby">修改第一个爱好为:开车</button>
            <br/>    

            <h2>姓名:{{student.name}}</h2>   
            <h2>年龄:{{student.age}}</h2>   
            <h2 v-if="student.sex">性别:{{student.sex}}</h2>    
            爱好:
            <ul>
                <li v-for="hobby in student.hobbies">
                    {{hobby}}
                </li>
            </ul>
            朋友们:
            <ul>
                <li v-for="friend in student.friends">
                    {{friend.name}}-{{friend.age}}
                </li>
            </ul>
            
        </div>
        <script type="text/javascript">
            new Vue({
                el: '#root',
                data: {
                    student:{
                        name: 'tom',
                        age: 22,
                        hobbies:[
                            '抽烟', '喝酒', '烫头',
                        ],
                        friends:[
                            {name: 'jerry', age: 35,},
                            {name: 'tony', age: 36},
                            ],  
                    }
                },
                methods: {
                    addSex(){
                        Vue.set(this.student, 'sex', '男');
                    },
                    addFriend(){
                        this.student.friends.unshift({name: 'Mike', age: 30})
                    },
                    updateFirstFriend(){
                        this.student.friends[0].name = '张三';
                    },
                    addHobby(){
                        this.student.hobbies.push('学习');
                    },
                    updateHobby(){
                        this.student.hobbies.splice(0, 1, '开车');
                        // 效果相同
                        // this.$set(this.student.hobbies, 0, '开车');
                        // Vue.set(this.student.hobbies, 0, '开车');
                    }
                    
                },
            })
        </script>
    </body>
</head>
</html>
