<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../js/vue.js"></script>
    <style>
        .basic{
            width: 400px;
            height: 100px;
            border: 1px solid black;
        }
        .normal{
            background-color: cyan;
        }
        .atguigu1{
            background-color: greenyellow;
        }
        .atguigu2{
            font-size: larger;
            font-weight: 100;
        }
    </style>
</head>
<body>
    
    <div id="root">
        <div class="basic" :class="mood" @click="changeMood">{{name}}</div>
        <div class="basic" :class="classObj" @click="changeMood">{{name}}</div>
        <div class="basic" :style="styleObj" @click="changeMood">{{name}}</div>
    </div>

    <script>
        new Vue({
            el:'#root',
            data() {
                return {
                    name: 'Enish',
                    mood: '',
                    classObj:{
                        atguigu1: true,
                        atguigu2: true,
                    },
                    styleObj:{
                        // 在设置style的属性时，只能指定原生有的属性，例如color，background-color，但是在多单词组成的属性中，需要用驼峰代替特殊字符'-'
                        color: 'green',
                        backgroundColor: 'purple',
                    }
                }
            },
            methods: {
                changeMood(){
                    this.mood = 'normal'
                }
            },
        })
    </script>
</body>
</html>
